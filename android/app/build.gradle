plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Declared but not applied yet — applied conditionally below, only
    // once google-services.json actually exists in this folder.
    id "com.google.gms.google-services" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.ptcao.edmate"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // flutter_local_notifications requires Java 8+ core library
        // desugaring to be enabled on Android, regardless of the app's own
        // source/target compatibility — see the "core library desugaring"
        // dependency added below.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    // Real release signing, needed because Google Play rejects an App
    // Bundle signed with the debug key ("signed in debug mode" error) —
    // internal testing included, not just a public release.
    //
    // Two ways to provide the keystore, so both local building and CI
    // (GitHub Actions) work the same way:
    //   1. A local android/key.properties file (never committed — see
    //      android/key.properties.example) pointing at a .jks on your own
    //      machine.
    //   2. CI env vars (ANDROID_KEYSTORE_PATH/_PASSWORD, ANDROID_KEY_ALIAS,
    //      ANDROID_KEY_PASSWORD) — see .github/workflows/build-apk.yml,
    //      which decodes a base64 keystore secret to that path before the
    //      build step.
    // If neither is present, the release build type below falls back to
    // the debug signing config, same as before — so the project keeps
    // building (for sideloading/testing) even before a keystore exists.
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("key.properties")
    def hasKeystoreProperties = keystorePropertiesFile.exists()
    if (hasKeystoreProperties) {
        keystorePropertiesFile.withReader("UTF-8") { reader ->
            keystoreProperties.load(reader)
        }
    }
    def releaseStoreFilePath = hasKeystoreProperties
        ? keystoreProperties["storeFile"]
        : System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
    def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile releaseStoreFile
                storePassword hasKeystoreProperties ? keystoreProperties["storePassword"] : System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias hasKeystoreProperties ? keystoreProperties["keyAlias"] : System.getenv("ANDROID_KEY_ALIAS")
                keyPassword hasKeystoreProperties ? keystoreProperties["keyPassword"] : System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        // Change this if you want a different package id on the Play
        // Store / device later — for a sideloaded APK it can stay as-is.
        applicationId "ptcao.etms.com"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Real keystore when one's configured (see signingConfigs.release
            // above); otherwise falls back to the debug key so the project
            // still builds for sideloading/testing before a keystore exists.
            // A debug-signed build bundle will be rejected by Google Play.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Required by flutter_local_notifications' AAR metadata check above —
    // backports newer java.time/java.util APIs so they work down to this
    // app's minSdkVersion 21.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Push notifications (Firebase Cloud Messaging) need this file, which
// contains your actual Firebase project's config — it's generated by the
// Firebase Console when you register this app (package id
// com.ptcao.edmate) and isn't something that can be faked or committed
// ahead of time. Applying the plugin only when the file is present means
// the app keeps building normally (push code just stays inactive) for
// anyone who hasn't done the Firebase setup yet, instead of the whole
// build failing on a missing-file error.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
