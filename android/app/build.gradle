plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Declared but not applied yet — applied conditionally below, only
    // once google-services.json actually exists in this folder.
    id "com.google.gms.google-services" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.ptcao.edmate"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Change this if you want a different package id on the Play
        // Store / device later — for a sideloaded APK it can stay as-is.
        applicationId "com.ptcao.edmate"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Signed with the debug key for now so `flutter build apk --release`
            // just works out of the box for internal sideloading. See
            // API_SETUP.md for how to add your own keystore before any wider
            // distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

// Push notifications (Firebase Cloud Messaging) need this file, which
// contains your actual Firebase project's config — it's generated by the
// Firebase Console when you register this app (package id
// com.ptcao.edmate) and isn't something that can be faked or committed
// ahead of time. Applying the plugin only when the file is present means
// the app keeps building normally (push code just stays inactive) for
// anyone who hasn't done the Firebase setup yet, instead of the whole
// build failing on a missing-file error.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
